version: "2"
sql:
  - engine: postgresql
    schema: "sql/schema.sql"
    queries: "sql/queries.sql"
    gen:
      go:
        package: "shopdb"
        out: "db"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "orders.status"
            go_type:
              import: "github.com/mathis-sperlich/gearbox/example/dbtypes"
              package: "dbtypes"
              type: "OrderStatus"
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
